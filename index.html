<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>メシルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 提灯の赤と墨色。1画面を縦に流し、ルーレットを主役にする */
:root{
  --bg:#f1f3ef; --fg:#18231f; --card:#ffffff; --line:#d6dbd4; --muted:#5d6b64;
  --accent:#d7322f; --accent-fg:#ffffff; --gold:#f2b705; --ok:#1f7a5a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --fg:#eaf0ec; --card:#1a2420; --line:#2f3d37; --muted:#9db0a6;
  --accent:#ef5350; --accent-fg:#ffffff; --gold:#f5c542; --ok:#4cc79b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --fg:#eaf0ec; --card:#1a2420; --line:#2f3d37; --muted:#9db0a6;
  --accent:#ef5350; --accent-fg:#ffffff; --gold:#f5c542; --ok:#4cc79b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
label,.lbl{font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=password],select{
  font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--fg)}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
button.btn{font-family:var(--display);font-weight:900;font-size:18px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;touch-action:manipulation;
  background:var(--accent);color:var(--accent-fg);flex:1 1 160px}
button.btn.sub{background:var(--fg);color:var(--bg)}
button.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-size:16px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--accent);font-weight:700}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.stage h2{font-family:var(--display);font-weight:900;font-size:18px;margin:0}
.wheelbox{position:relative;width:min(100%,400px);aspect-ratio:1}
.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--fg);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hub{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--fg)}
.result{font-family:var(--display);font-weight:900;font-size:26px;text-align:center;min-height:38px;text-wrap:balance}
.shop{display:flex;flex-direction:column;gap:6px}
.shop .nm{font-family:var(--display);font-weight:900;font-size:22px}
.shop .meta{font-size:14px;color:var(--muted)}
.shop a{color:var(--accent);font-weight:700;font-size:15px}
footer{font-size:12px;color:var(--muted);text-align:center}
footer a{color:var(--muted)}

/* 連打画面 */
#mash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden;user-select:none;-webkit-user-select:none}
#mash[hidden]{display:none}
#mash .t{font-family:var(--display);font-weight:900;font-size:20px;text-align:center}
#mash .n{font-family:var(--display);font-weight:900;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
#mash .n small{font-size:18px;color:var(--muted);margin-left:4px}
.bar{width:min(86vw,360px);height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.stagewrap{position:relative;width:100%;height:min(54vh,340px);display:flex;align-items:center;justify-content:center}
#mbtn{position:relative;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:900;font-size:22px;
  width:110px;height:110px;max-width:80vw;max-height:80vw;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:width .06s,height .06s}
#mbtn.hit{animation:hit .12s}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(.9) rotate(-3deg)}100%{transform:scale(1)}}
.fx{position:absolute;pointer-events:none;border-radius:50%;border:4px solid var(--gold);animation:ring .5s ease-out forwards}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.sp{position:absolute;pointer-events:none;font-size:22px;color:var(--gold);font-weight:900;animation:fly .6s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
#mdone{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#mdone[hidden]{display:none}
#mhold{position:relative;overflow:hidden;font-family:var(--display);font-weight:900;font-size:18px;border:2px solid var(--ok);color:var(--ok);background:transparent;border-radius:14px;padding:16px 28px;touch-action:none;user-select:none;-webkit-user-select:none}
#mhold[disabled]{opacity:.35}
#mhold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok);opacity:.35}
#mcancel{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
@media (prefers-reduced-motion:reduce){#mbtn.hit,.fx,.sp{animation:none}}
</style>
</head>
<body>
<main>
  <h1>メシルーレット<small id="ver"></small></h1>

  <section class="card" aria-label="条件">
    <div class="row">
      <button class="btn ghost" id="loc" type="button">📍 現在地を取得</button>
    </div>
    <div class="status" id="locst">現在地はまだ取得していません</div>
    <div class="row">
      <div class="field"><label for="yen">1人の予算（円）</label><input id="yen" type="number" inputmode="numeric" min="0" step="100" value="1500"></div>
      <div class="field"><label for="range">探す範囲</label>
        <select id="range"><option value="1">300m</option><option value="2">500m</option><option value="3" selected>1km</option><option value="4">2km</option><option value="5">3km</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="fami" checked> ファミレスを含める</label>
    <div>
      <div class="lbl">ジャンルで絞る（選ばなければ全ジャンル。1つだけ選ぶとジャンルルーレットを飛ばす）</div>
      <div class="chips" id="chips" style="margin-top:6px"></div>
    </div>
    <details>
      <summary>APIキーの設定</summary>
      <div class="field" style="margin-top:8px"><label for="key">ホットペッパー Webサービスのキー（この端末にだけ保存）</label><input id="key" type="password" autocomplete="off" placeholder="キーを貼り付け"></div>
    </details>
    <div class="row">
      <button class="btn" id="goGenre" type="button">ジャンルから決める</button>
      <button class="btn sub" id="goShop" type="button">お店を直接決める</button>
    </div>
    <div class="status" id="msg"></div>
  </section>

  <section class="card stage" id="stage" hidden aria-live="polite">
    <h2 id="stitle"></h2>
    <div class="wheelbox"><div class="pointer"></div><canvas id="cv" width="800" height="800"></canvas><div class="hub"></div></div>
    <div class="result" id="result"></div>
    <div class="shop" id="shop" hidden></div>
    <div class="row" id="again" hidden style="width:100%">
      <button class="btn" id="againShop" type="button">お店をもう一回</button>
      <button class="btn sub" id="againGenre" type="button">ジャンルをもう一回</button>
    </div>
  </section>

  <footer>お店情報: <a href="http://webservice.recruit.co.jp/" target="_blank" rel="noopener">Powered by ホットペッパー Webサービス</a></footer>
</main>

<div id="mash" hidden role="dialog" aria-label="もう一回の連打">
  <button id="mcancel" type="button">やめる</button>
  <div class="t" id="mtitle">もう一回するには連打！</div>
  <div class="n"><span id="mnum">300</span><small>回</small></div>
  <div class="bar"><i id="mbar"></i></div>
  <div class="stagewrap" id="mwrap"><button id="mbtn" type="button" aria-label="連打">もう一回</button></div>
  <div id="mdone" hidden>
    <div class="t">連打おつかれさま！<br><small style="font-weight:500;color:var(--muted)">連打が落ち着くまで少し待ってね</small></div>
    <button id="mhold" type="button" disabled><i id="mholdbar"></i><span id="mholdtxt">待機中…</span></button>
  </div>
</div>

<script>
'use strict';
const Q=new URLSearchParams(location.search);
const TEST=Q.has('test'), DEMO=Q.has('demo');
const MASH_TOTAL=TEST?30:300;          // 本番300回、?test=1 で30回
const SHOP_COUNT=15;
document.getElementById('ver').textContent=TEST?'テスト(30回)':'';

/* ---- ジャンル(あなたが選んだ15件)。codeは初期値で、ホットペッパーのマスタ名と一致したら上書きする ---- */
const GENRES=[
  {label:'和食',match:'和食',code:'G004'},{label:'洋食',match:'洋食',code:'G005'},
  {label:'イタリアン・フレンチ',match:'イタリアン',code:'G006'},{label:'中華',match:'中華',code:'G007'},
  {label:'焼肉・ホルモン',match:'焼肉',code:'G008'},{label:'ラーメン',match:'ラーメン',code:'G013'},
  {label:'韓国料理',match:'韓国',code:'G017'},{label:'アジア・エスニック',match:'アジア',code:'G009'},
  {label:'居酒屋',match:'居酒屋',code:'G001'},{label:'お好み焼き・もんじゃ',match:'お好み焼き',code:'G016'},
  {label:'創作料理',match:'創作',code:'G003'},{label:'各国料理',match:'各国',code:'G010'},
  {label:'ダイニングバー・バル',match:'ダイニングバー',code:'G002'},{label:'カフェ・スイーツ',match:'カフェ',code:'G014'},
  {label:'バー・カクテル',match:'バー・カクテル',code:'G012'}
];
/* ホットペッパーにファミレスのジャンルは無いので、店名で判定する */
const FAMIRE=['ガスト','サイゼリヤ','サイゼ','デニーズ','ジョナサン','バーミヤン','ココス','ロイヤルホスト','ジョイフル','夢庵','びっくりドンキー','ビッグボーイ','藍屋','しゃぶ葉','ステーキガスト','から好し','ホリーズ','フジオフード','洋食屋ガスト'];

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const st={lat:null,lng:null,busy:false,mode:null,genre:null,shops:[],lastPool:null,empty:new Set(),single:false};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 画面の部品 ---------- */
const chipsEl=$('chips');
GENRES.forEach(g=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=g.label;b.setAttribute('aria-pressed','false');
  b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');g.el=b;chipsEl.appendChild(b)});
$('key').value=store.get('hpkey')||'';
$('key').onchange=()=>store.set('hpkey',$('key').value.trim());
['yen','range'].forEach(id=>{const v=store.get(id);if(v!==null)$(id).value=v;$(id).onchange=()=>store.set(id,$(id).value)});
const say=(t,err)=>{$('msg').textContent=t||'';$('msg').className='status'+(err?' err':'')};

/* ---------- 現在地 ---------- */
function getLoc(){
  return new Promise((res,rej)=>{
    if(DEMO){st.lat=35.6812;st.lng=139.7671;$('locst').textContent='現在地(デモ): 東京駅付近';return res()}
    if(!navigator.geolocation)return rej(new Error('この端末では現在地を取得できません'));
    $('locst').textContent='現在地を取得中…';
    navigator.geolocation.getCurrentPosition(p=>{
      st.lat=p.coords.latitude;st.lng=p.coords.longitude;
      $('locst').textContent=`現在地を取得しました（誤差およそ${Math.round(p.coords.accuracy)}m）`;res();
    },e=>{$('locst').textContent='現在地を取得できませんでした';rej(new Error(e.code===1?'現在地の許可が必要です。ブラウザの設定で許可してください':'現在地を取得できませんでした'))},
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });
}
$('loc').onclick=()=>getLoc().catch(e=>say(e.message,true));

/* ---------- ホットペッパーAPI ---------- */
const API='https://webservice.recruit.co.jp/hotpepper/';
let jid=0;
function jsonp(url){
  return new Promise((res,rej)=>{
    const name='__hp'+(++jid);const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej(new Error('timeout'))},12000);
    function cleanup(){clearTimeout(t);delete window[name];s.remove()}
    window[name]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej(new Error('script'))};
    s.src=url+'&callback='+name;document.head.appendChild(s);
  });
}
async function hp(path,params){
  if(DEMO)return demoApi(path,params);
  const key=$('key').value.trim();if(!key)throw new Error('APIキーを入力してください（上の「APIキーの設定」）');
  const q=new URLSearchParams({key,format:'json',...params});const url=API+path+'/v1/?'+q;
  let d;
  try{d=await jsonp(url)}catch(e1){
    try{const r=await fetch(url);d=await r.json()}catch(e2){throw new Error('お店の情報を取得できませんでした（通信方式を確認が必要）')}
  }
  const er=d&&d.results&&d.results.error;
  if(er&&er.length)throw new Error('ホットペッパーのエラー: '+er[0].message+'（'+er[0].code+'）');
  return d.results;
}
let masters=null;
async function loadMasters(){
  if(masters)return masters;
  const c=store.get('hpmasters');
  if(c){try{masters=JSON.parse(c);if(masters.t>Date.now()-30*864e5)return applyMasters(masters)}catch(e){}}
  const [g,b]=await Promise.all([hp('genre',{}),hp('budget',{})]);
  masters={t:Date.now(),genre:g.genre,budget:b.budget};store.set('hpmasters',JSON.stringify(masters));
  return applyMasters(masters);
}
function applyMasters(m){
  GENRES.forEach(g=>{const f=m.genre.find(x=>x.name.includes(g.match));if(f)g.code=f.code});
  m.bands=m.budget.map(x=>{const n=(x.name.match(/\d+/g)||[]).map(Number);const lo=x.name.startsWith('～')||x.name.startsWith('~')?0:n[0];
    const hi=/円～$|円~$/.test(x.name)&&n.length===1?Infinity:(n.length>1?n[1]:n[0]);return {code:x.code,lo:lo,hi:hi}}).filter(x=>isFinite(x.lo)).sort((a,b)=>a.lo-b.lo);
  return m;
}
/* 予算前後: 金額が入る区分と、金額が区分の端に近い側の隣の区分（最大2つ） */
function budgetCodes(yen){
  const b=masters.bands;if(!b||!b.length||!(yen>0))return [];
  let i=b.findIndex(x=>yen>=x.lo&&yen<=x.hi);if(i<0)i=b.length-1;
  const mid=(b[i].lo+Math.min(b[i].hi,b[i].lo*1.5))/2;
  const j=yen>=mid?i+1:i-1;const codes=[b[i].code];if(b[j])codes.push(b[j].code);return codes;
}
const dist=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function fetchShops(genreCodes){
  await loadMasters();
  const base={lat:st.lat,lng:st.lng,range:$('range').value,count:100,type:'lite'};
  const bc=budgetCodes(+$('yen').value);if(bc.length)base.budget=bc.join(',');
  const lists=await Promise.all((genreCodes&&genreCodes.length?genreCodes:[null]).map(c=>hp('gourmet',c?{...base,genre:c}:base)));
  const seen=new Map();lists.forEach(r=>(r.shop||[]).forEach(s=>seen.set(s.id,s)));
  let arr=[...seen.values()];
  if(!$('fami').checked)arr=arr.filter(s=>!FAMIRE.some(w=>s.name.includes(w)));
  arr.forEach(s=>s._d=dist(st.lat,st.lng,+s.lat,+s.lng));arr.sort((a,b)=>a._d-b._d);
  return arr.slice(0,SHOP_COUNT);
}

/* デモ用のにせデータ（?demo=1 のときだけ使う） */
function demoApi(path,p){
  if(path==='genre')return Promise.resolve({genre:[['G001','居酒屋'],['G002','ダイニングバー・バル'],['G003','創作料理'],['G004','和食'],['G005','洋食'],['G006','イタリアン・フレンチ'],['G007','中華'],['G008','焼肉・ホルモン'],['G009','アジア・エスニック料理'],['G010','各国料理'],['G012','バー・カクテル'],['G013','ラーメン'],['G014','カフェ・スイーツ'],['G016','お好み焼き・もんじゃ'],['G017','韓国料理']].map(([code,name])=>({code,name}))});
  if(path==='budget')return Promise.resolve({budget:[['B009','～500円'],['B010','501～1000円'],['B011','1001～1500円'],['B001','1501～2000円'],['B002','2001～3000円'],['B003','3001～4000円'],['B008','4001～5000円']].map(([code,name])=>({code,name}))});
  const names=['麺屋 さくら亭','ガスト 駅前店','中華 龍門','トラットリア ソーレ','焼肉 大黒','和食 ほたる','サイゼリヤ 大通り店','韓国食堂 ソウル','洋食 グリル青木','カフェ ひだまり','居酒屋 とりまる','もんじゃ 月島屋','創作 一献','バル ラ・ルナ','ラーメン 一心','タイ食堂 ミンガラ','寿司 かもめ','定食 まんぷく','ステーキ 肉匠','うどん 讃岐や'];
  const n=Math.min(100,(p.genre==='G005'?0:20));const shop=[];
  for(let i=0;i<n;i++)shop.push({id:'d'+(p.genre||'x')+i,name:names[i%names.length]+(i>=names.length?'2号店':''),lat:st.lat+(i%7-3)*.0006,lng:st.lng+(i%5-2)*.0006,
    genre:{name:p.genre||'デモ'},budget:{name:'1001～1500円'},access:'デモ駅 徒歩'+(i+2)+'分',urls:{pc:'https://www.hotpepper.jp/'}});
  return new Promise(r=>setTimeout(()=>r({shop}),300));
}

/* ---------- ルーレット ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
const PAL=['#e4572e','#f3a712','#29a98f','#2e86ab','#7b5ea7','#d1495b','#6a994e','#ee7b30'];
let wheelLabels=[],angle=0;
function drawWheel(){
  const n=wheelLabels.length,R=cv.width/2,step=2*Math.PI/n;ctx.clearRect(0,0,cv.width,cv.height);if(!n)return;
  ctx.save();ctx.translate(R,R);ctx.rotate(angle);
  wheelLabels.forEach((t,i)=>{
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-6,i*step,(i+1)*step);ctx.closePath();
    ctx.fillStyle=(i===n-1&&i%8===0&&n>1)?PAL[4]:PAL[i%8];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();
    ctx.save();ctx.rotate(i*step+step/2);ctx.textAlign='right';ctx.textBaseline='middle';
    const fs=n>12?30:n>8?36:44;ctx.font=`900 ${fs}px "Zen Maru Gothic",sans-serif`;ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=5;
    const s=t.length>9?t.slice(0,9)+'…':t;ctx.fillText(s,R-34,0);ctx.restore();
  });
  ctx.restore();
}
/* 当たりを先に決めて、その区画の中で止まるように回す */
function spin(){
  return new Promise(res=>{
    const n=wheelLabels.length,step=2*Math.PI/n,win=Math.floor(Math.random()*n);
    const within=(.15+Math.random()*.7)*step;
    // ポインタは上(-90°)。区画winの中の点がそこに来る角度
    const target=((-Math.PI/2-(win*step+within))%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    const cur=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    let delta=target-cur;while(delta<0)delta+=2*Math.PI;
    const total=delta+2*Math.PI*(5+Math.floor(Math.random()*3)),start=angle,dur=4200,t0=performance.now();
    (function f(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);angle=start+total*e;drawWheel();
      if(p<1)requestAnimationFrame(f);else res(win)})(t0);
  });
}
function setWheel(labels,title){wheelLabels=labels;$('stage').hidden=false;$('stitle').textContent=title;$('result').textContent='';$('shop').hidden=true;$('again').hidden=true;drawWheel();
  $('stage').scrollIntoView({behavior:'smooth',block:'start'})}

/* ---------- 流れ ---------- */
function setBusy(b){st.busy=b;['goGenre','goShop','againShop','againGenre','loc'].forEach(id=>$(id).disabled=b)}
function pool(){const sel=GENRES.filter(g=>g.el.getAttribute('aria-pressed')==='true');return sel.length?sel:GENRES}
async function runShop(genres,reuse){
  if(!reuse){say('お店を探しています…');st.shops=await fetchShops(genres&&genres.map(g=>g.code));say('')}
  if(!st.shops.length)return 'empty';
  setWheel(st.shops.map(s=>s.name),genres&&genres.length===1?`お店ルーレット（${genres[0].label}）`:'お店ルーレット');
  const i=await spin(),s=st.shops[i];
  $('result').textContent='🎯 '+s.name;
  const m=`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  const sh=$('shop');sh.innerHTML='';
  const add=(cls,txt)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;sh.appendChild(d)};
  add('meta',[s.genre&&s.genre.name,s.budget&&(s.budget.average||s.budget.name),s.access].filter(Boolean).join(' ／ '));
  add('meta',`現在地から約${Math.round(s._d||0)}m`);
  const lk=document.createElement('div');lk.className='row';
  [['ホットペッパーで見る',s.urls&&s.urls.pc],['地図で見る',m]].forEach(([t,u])=>{if(!u)return;const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent=t;lk.appendChild(a)});
  sh.appendChild(lk);sh.hidden=false;
  return 'ok';
}
async function runGenre(){
  const p=pool().filter(g=>!st.empty.has(g.code));
  if(!p.length){say('近くに条件に合うジャンルがありません。予算や範囲を変えてください',true);return}
  setWheel(p.map(g=>g.label),'ジャンルルーレット');
  const g=p[await spin()];st.genre=g;$('result').textContent='🎯 '+g.label;await sleep(1300);
  const r=await runShop([g]);
  if(r==='empty'){st.empty.add(g.code);say(`${g.label}は条件に合う店が無いので、回し直します`);await sleep(1600);say('');return runGenre()}
  $('againGenre').hidden=false;
}
async function start(mode){
  if(st.busy)return;
  say('');setBusy(true);
  try{
    if(st.lat==null)await getLoc();
    await loadMasters();
    st.mode=mode;st.empty=new Set();
    const p=pool(),sel=GENRES.filter(g=>g.el.getAttribute('aria-pressed')==='true');
    st.single=sel.length===1;
    if(mode==='genre'&&!st.single){await runGenre()}
    else{const gs=mode==='genre'?sel:(sel.length?sel:null);const r=await runShop(gs);if(r==='empty')say('条件に合う店が見つかりません。予算・範囲・ジャンルを変えてください',true)}
    afterRun();
  }catch(e){say(e.message,true)}
  setBusy(false);
}
function afterRun(){
  const hasShop=!$('shop').hidden;
  $('again').hidden=!hasShop;
  $('againGenre').hidden=!(hasShop&&st.mode==='genre'&&!st.single);
}
$('goGenre').onclick=()=>start('genre');
$('goShop').onclick=()=>start('shop');

/* もう一回 → 連打してから */
$('againShop').onclick=async()=>{
  if(st.busy)return;if(!await mash('お店をもう一回'))return;
  setBusy(true);try{await runShop(null,true);afterRun()}catch(e){say(e.message,true)}setBusy(false);
};
$('againGenre').onclick=async()=>{
  if(st.busy)return;if(!await mash('ジャンルをもう一回'))return;
  setBusy(true);try{await runGenre();afterRun()}catch(e){say(e.message,true)}setBusy(false);
};

/* ---------- 連打画面 ---------- */
function mash(title){
  return new Promise(resolve=>{
    const ov=$('mash'),btn=$('mbtn'),num=$('mnum'),bar=$('mbar'),wrap=$('mwrap'),done=$('mdone'),hold=$('mhold'),hb=$('mholdbar'),ht=$('mholdtxt');
    let count=0,over=false,holdT=null,holdStart=0,raf=0;
    $('mtitle').textContent=title+'するには連打！';
    num.textContent=MASH_TOTAL;bar.style.width='0';btn.hidden=false;wrap.hidden=false;done.hidden=true;btn.style.width=btn.style.height='';
    ov.hidden=false;document.body.style.overflow='hidden';
    const cleanup=v=>{over=true;cancelAnimationFrame(raf);btn.onpointerdown=null;hold.onpointerdown=null;ov.hidden=true;document.body.style.overflow='';$('mcancel').onclick=null;resolve(v)};
    $('mcancel').onclick=()=>cleanup(false);
    btn.onpointerdown=ev=>{
      ev.preventDefault();if(over||count>=MASH_TOTAL)return;
      count++;const left=MASH_TOTAL-count,p=count/MASH_TOTAL;
      num.textContent=left;bar.style.width=(p*100)+'%';
      const w=Math.min(110+210*p,Math.min(window.innerWidth*.8,340));btn.style.width=btn.style.height=w+'px';
      btn.classList.remove('hit');void btn.offsetWidth;btn.classList.add('hit');
      fx(wrap,btn,w);try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
      if(left===0)finish();
    };
    function finish(){
      btn.hidden=true;wrap.hidden=true;done.hidden=false;hold.disabled=true;ht.textContent='待機中…';hb.style.width='0';
      // 連打の指が止まるのを待つ。ここでは何を押しても先に進まない
      setTimeout(()=>{if(over)return;hold.disabled=false;ht.textContent='長押しで回す';},2200);
    }
    // 長押し(約1秒)で初めて先に進む。連打では進まない
    hold.onpointerdown=ev=>{
      ev.preventDefault();if(hold.disabled||over)return;holdStart=performance.now();
      const tick=now=>{const p=Math.min((now-holdStart)/1000,1);hb.style.width=(p*100)+'%';if(p>=1){cleanup(true)}else raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
    };
    const rel=()=>{cancelAnimationFrame(raf);if(!over)hb.style.width='0'};
    hold.onpointerup=rel;hold.onpointerleave=rel;hold.onpointercancel=rel;
  });
}
function fx(wrap,btn,w){
  const r=wrap.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;
  const ring=document.createElement('span');ring.className='fx';ring.style.cssText=`left:${cx-w/2}px;top:${cy-w/2}px;width:${w}px;height:${w}px`;wrap.appendChild(ring);ring.onanimationend=()=>ring.remove();
  for(let i=0;i<4;i++){const s=document.createElement('span');s.className='sp';s.textContent=['✦','＋','★','♪'][i%4];
    const a=Math.random()*Math.PI*2,d=w/2+30+Math.random()*40;s.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;wrap.appendChild(s);s.onanimationend=()=>s.remove()}
}
drawWheel();
</script>
