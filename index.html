<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>どこ食う</title>
<link rel="icon" type="image/png" href="icon/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon/icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d7322f">
<meta name="apple-mobile-web-app-title" content="どこ食う">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 提灯の赤と墨色。1画面を縦に流し、ルーレットを主役にする */
:root{
  --bg:#f1f3ef; --fg:#18231f; --card:#ffffff; --line:#d6dbd4; --muted:#5d6b64;
  --accent:#d7322f; --accent-fg:#ffffff; --gold:#f2b705; --ok:#1f7a5a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --fg:#eaf0ec; --card:#1a2420; --line:#2f3d37; --muted:#9db0a6;
  --accent:#ef5350; --accent-fg:#ffffff; --gold:#f5c542; --ok:#4cc79b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --fg:#eaf0ec; --card:#1a2420; --line:#2f3d37; --muted:#9db0a6;
  --accent:#ef5350; --accent-fg:#ffffff; --gold:#f5c542; --ok:#4cc79b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
label,.lbl{font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=password],select{
  font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--fg)}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
button.btn{font-family:var(--display);font-weight:900;font-size:18px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;touch-action:manipulation;
  background:var(--accent);color:var(--accent-fg);flex:1 1 160px}
button.btn.sub{background:var(--fg);color:var(--bg)}
button.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-size:16px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--accent);font-weight:700}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.stage h2{font-family:var(--display);font-weight:900;font-size:18px;margin:0}
.wheelbox{position:relative;width:min(100%,400px);aspect-ratio:1}
.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--fg);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hub{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--fg)}
.result{font-family:var(--display);font-weight:900;font-size:26px;text-align:center;min-height:38px;text-wrap:balance}
.shop{display:flex;flex-direction:column;gap:6px}
.shop .nm{font-family:var(--display);font-weight:900;font-size:22px}
.shop .meta{font-size:14px;color:var(--muted)}
.shop a{color:var(--accent);font-weight:700;font-size:15px}
footer{font-size:11px;color:var(--muted);text-align:center}
footer a{color:var(--muted)}

[hidden]{display:none!important}
.hub,.pointer{pointer-events:none}
.wheelbox canvas.tap{cursor:pointer;touch-action:manipulation}
.hint{font-family:var(--display);font-weight:900;font-size:17px;color:var(--accent);min-height:26px;text-align:center}
.loading{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:900;font-size:18px;padding:56px 0}
.loading .spin{width:26px;height:26px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
button.lk{font-family:var(--body);background:transparent;cursor:pointer}
a.lk,button.lk{display:inline-block;padding:10px 14px;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);font-weight:700;text-decoration:none;font-size:15px}
@media (prefers-reduced-motion:reduce){.loading .spin{animation:none}}
/* 連打画面 */
#mash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden;user-select:none;-webkit-user-select:none}
#mash[hidden]{display:none}
#mash .t{font-family:var(--display);font-weight:900;font-size:20px;text-align:center}
#mash .n{font-family:var(--display);font-weight:900;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
#mash .n small{font-size:18px;color:var(--muted);margin-left:4px}
.bar{width:min(86vw,360px);height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.stagewrap{position:relative;width:100%;height:min(54vh,340px);display:flex;align-items:center;justify-content:center}
#mbtn{position:relative;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:900;font-size:22px;
  width:110px;height:110px;max-width:80vw;max-height:80vw;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:width .06s,height .06s}
#mbtn.hit{animation:hit .12s}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(.9) rotate(-3deg)}100%{transform:scale(1)}}
.fx{position:absolute;pointer-events:none;border-radius:50%;border:4px solid var(--gold);animation:ring .5s ease-out forwards}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.sp{position:absolute;pointer-events:none;font-size:22px;color:var(--gold);font-weight:900;animation:fly .6s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
#mdone{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#mdone[hidden]{display:none}
#mhold{position:relative;overflow:hidden;font-family:var(--display);font-weight:900;font-size:18px;border:2px solid var(--ok);color:var(--ok);background:transparent;border-radius:14px;padding:16px 28px;touch-action:none;user-select:none;-webkit-user-select:none}
#mhold[disabled]{opacity:.35}
#mhold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok);opacity:.35}
#mcancel{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
@media (prefers-reduced-motion:reduce){#mbtn.hit,.fx,.sp{animation:none}}
/* 1画面に収める（スクロールを減らす） */
body{padding-block:10px 8px}
main{gap:8px}
h1{font-size:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
button.btn.small{flex:0 0 auto;font-size:14px;padding:8px 12px}
.status{min-height:0;font-size:12px}
.status:empty{display:none}

.stage{gap:6px;padding:8px 10px}
.stage h2{font-size:14px;color:var(--muted)}
.wheelbox{width:clamp(180px,calc(100vh - 440px),400px);max-width:100%}
@supports (height:100dvh){.wheelbox{width:clamp(180px,calc(100dvh - 440px),400px);max-width:100%}}
.hint{font-size:15px;min-height:20px}
.hint.tap{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:8px 24px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.result{font-size:21px;min-height:28px}
.shop{gap:2px;align-items:center;text-align:center}
.shop .meta{font-size:13px}
a.lk,button.lk{padding:8px 12px;font-size:14px}
#again button.btn{padding:10px 12px;font-size:15px}
/* 開始ボタンは縦に並べて大きく。結果が出ている間は少し小さくして1画面に収める */
.go{display:flex;flex-direction:column;gap:10px}
.go button.btn{width:100%;flex:none;font-size:20px;padding:20px 12px;white-space:nowrap}
body.round .go{gap:6px}
body.round .go button.btn{font-size:16px;padding:10px 12px}
details summary{padding:4px 0;font-size:15px}
.advbody{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.wheelbox{width:clamp(170px,calc(100vh - 500px),400px)}
@supports (height:100dvh){.wheelbox{width:clamp(170px,calc(100dvh - 500px),400px)}}
/* ルーレットは、画面の幅いっぱい（高さが足りない画面では高さに合わせる） */
.wheelbox{width:min(100%,calc(100vh - 260px),520px);max-width:100%}
@supports (height:100dvh){.wheelbox{width:min(100%,calc(100dvh - 260px),520px);max-width:100%}}
.stage{padding:8px 4px}
/* 決まったジャンル・店を大きく出す */
.reslab{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);text-align:center}
.reslab:empty{display:none}
.result{font-size:clamp(34px,11vw,56px);line-height:1.2;min-height:0;color:var(--accent);padding:4px 6px;word-break:break-word}
.result:empty{display:none}
#nextBtn{width:100%;flex:none;font-size:22px;padding:22px 12px;margin-top:6px}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
#map{height:260px;border-radius:12px;overflow:hidden;position:relative;z-index:0;background:var(--line)}
#mapbox{display:flex;flex-direction:column;gap:6px}
#mapbox[hidden]{display:none}
#mapq{min-width:0}
/* 全画面: 検索バーは上に残す */
#mapbox.full{position:fixed;inset:0;z-index:55;background:var(--bg);gap:8px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#mapbox.full #map{flex:1 1 auto;height:auto;min-height:0}
#genreRe{width:100%;flex:none;font-size:16px;padding:10px 12px}
/* 条件に合う店が無いとき: 落ち込みの縦線（墨の線がたれる）で大きく知らせる */
.empty{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:6px}
.empty[hidden]{display:none}
#drip{width:100%;height:120px;display:block;color:var(--fg);border-radius:10px 10px 0 0}
#drip .w1{fill:color-mix(in srgb,var(--fg) 22%,transparent)}
#drip .w2{fill:color-mix(in srgb,var(--fg) 11%,transparent)}
#drip line{stroke:currentColor;stroke-width:5;stroke-linecap:round}
.empty .et{font-family:var(--display);font-weight:900;font-size:clamp(26px,8vw,38px);line-height:1.3}
.empty .es{font-size:14px;color:var(--muted)}
.empty .btn{width:100%;flex:none}
</style>
</head>
<body>
<main>
  <div class="top"><h1>どこ食う</h1><button class="btn ghost small" id="optbtn" type="button" hidden>⚙ 設定</button></div>

  <section class="card" id="opts" aria-label="条件">
    <div class="row">
      <button class="btn ghost" id="loc" type="button">📍 現在地を取得</button>
      <span class="status" id="locst">現在地はまだ取得していません</span>
    </div>
    <div class="field" style="flex:none"><label for="place">場所を指定（駅名・住所。空欄なら現在地）</label><input id="place" type="text" placeholder="例: 池袋駅" autocomplete="off"></div>
    <button class="btn ghost small" id="mapbtn" type="button" style="align-self:flex-start">🗺 地図でピンを刺す</button>
    <div id="mapbox" hidden>
      <div class="row" style="flex-wrap:nowrap">
        <input id="mapq" type="text" placeholder="地図の中で検索（例: 池袋駅）" autocomplete="off" enterkeyhint="search" style="flex:1 1 auto">
        <button class="btn small" id="mapgo" type="button">検索</button>
        <button class="btn ghost small" id="mapfs" type="button" aria-label="地図を全画面にする">⛶</button>
      </div>
      <div class="status" id="mapmsg"></div>
      <div id="map"></div>
      <div class="status">地図をタップするとピンが立ちます。ピンはドラッグで動かせます。赤い円が探す範囲です。</div>
    </div>
    <div class="row">
      <div class="field"><label for="yen">1人の予算（円）</label><input id="yen" type="number" inputmode="numeric" min="0" step="100" value="1500"></div>
      <div class="field"><label for="range">探す範囲</label>
        <select id="range"><option value="1">300m</option><option value="2">500m</option><option value="3" selected>1km</option><option value="4">2km</option><option value="5">3km</option></select></div>
    </div>
    <details id="adv">
      <summary>詳細設定</summary>
      <div class="advbody">
        <label class="chk"><input type="checkbox" id="fami" checked> ファミレスを含める</label>
        <label class="chk"><input type="checkbox" id="unk" checked> 価格が不明な店も含める</label>
        <div>
          <div class="lbl">ジャンルで絞る（色が付いたジャンルだけがルーレットに入る。1つだけ選ぶとジャンルルーレットを飛ばす）</div>
          <div class="chips" id="chips" style="margin-top:6px"></div>
        </div>
      </div>
    </details>
  </section>
  <div class="go">
    <button class="btn" id="goGenre" type="button">ジャンルから決める</button>
    <button class="btn sub" id="goShop" type="button">お店を直接決める</button>
  </div>
  <div class="status" id="msg"></div>
  <div class="status" id="usage"></div>

  <section class="card stage" id="stage" hidden aria-live="polite">
    <h2 id="stitle"></h2>
    <div class="loading" id="loading" hidden><span class="spin"></span><span id="loadtxt">お店を取得中…</span></div>
    <div class="wheelbox" id="wheelbox"><div class="pointer"></div><canvas id="cv" width="800" height="800"></canvas><div class="hub"></div></div>
    <div class="hint" id="hint"></div>
    <div class="reslab" id="reslab"></div>
    <div class="result" id="result"></div>
    <button class="btn" id="nextBtn" type="button" hidden>タップしてお店決めへ</button>
    <button class="btn" id="genreRe" type="button" hidden>ジャンルを選び直す</button>
    <div class="empty" id="empty" hidden>
      <svg id="drip" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="et">条件に合うお店は<br>見つかりません</div>
      <div class="es">予算・探す範囲・ジャンルを変えてみてください</div>
      <button class="btn" id="emptyBack" type="button">条件を変えてやり直す</button>
    </div>
    <div class="shop" id="shop" hidden></div>
    <div class="row" id="again" hidden style="width:100%">
      <button class="btn sub" id="againShop" type="button">お店をもう一回</button>
      <button class="btn" id="againGenre" type="button">ジャンルから選び直す</button>
    </div>
  </section>

  <footer>お店情報: <a href="https://www.google.com/maps" target="_blank" rel="noopener">Google マップ</a></footer>
</main>

<div id="mash" hidden role="dialog" aria-label="もう一回の連打">
  <button id="mcancel" type="button">やめる</button>
  <div class="t" id="mtitle">もう一回するには連打！</div>
  <div class="n"><span id="mnum">300</span><small>回</small></div>
  <div class="bar"><i id="mbar"></i></div>
  <div class="stagewrap" id="mwrap"><button id="mbtn" type="button" aria-label="連打">もう一回</button></div>
  <div id="mdone" hidden>
    <div class="t">連打おつかれさま！</div>
    <button id="mhold" type="button"><i id="mholdbar"></i><span id="mholdtxt">長押しで回す</span></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* 連打の回数はボタンごとに変える（ボタンの重さの差をつけるため） */
const MASH_GENRE_RE=100;               // ジャンルの選び直し（ジャンルルーレットだけ回し直す）
const MASH_SHOP_SAME=100;              // ジャンルはそのままで、お店の選び直し
const MASH_SHOP_DIRECT=300;            // お店を直接決めた（ジャンルを回していない）あとの、お店の選び直し
const MASH_RESET=300;                  // ジャンルから選び直す（初期画面に戻る）
const SHOP_COUNT=15;

/* ---- ジャンル(あなたが選んだ15件)。qはGoogleマップの検索語 ---- */
const GENRES=[
  ['和食','和食 日本料理'],['洋食','洋食 ハンバーグ オムライス'],['イタリアン・フレンチ','イタリアン フレンチ'],['中華','中華料理'],
  ['焼肉・ホルモン','焼肉 ホルモン'],['ラーメン','ラーメン'],['韓国料理','韓国料理'],['アジア・エスニック','アジア料理 エスニック タイ ベトナム インド'],
  ['居酒屋','居酒屋'],['お好み焼き・もんじゃ','お好み焼き もんじゃ'],['創作料理','創作料理'],['各国料理','各国料理 メキシコ スペイン トルコ'],
  ['ダイニングバー・バル','ダイニングバー バル'],['カフェ・スイーツ','カフェ スイーツ'],['バー・カクテル','バー カクテル']
].map(([label,q])=>({label,q,code:label}));
/* ファミレスという分類は無いので、店名で判定する */
const FAMIRE=['ガスト','サイゼリヤ','サイゼ','デニーズ','ジョナサン','バーミヤン','ココス','ロイヤルホスト','ジョイフル','夢庵','びっくりドンキー','ビッグボーイ','藍屋','しゃぶ葉','ステーキガスト','から好し','ホリーズ','フジオフード','洋食屋ガスト'];

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const st={round:0,src:null,pin:null,lat:null,lng:null,busy:false,mode:null,genre:null,shops:[],lastPool:null,empty:new Set(),single:false};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* ---------- 画面の部品 ---------- */
const chipsEl=$('chips');
const DEFAULT_OFF=['カフェ・スイーツ','バー・カクテル'];     // 最初は、この2つ以外が選ばれている
let savedSel=null;try{savedSel=JSON.parse(store.get('gsel')||'null')}catch(e){}
const saveSel=()=>store.set('gsel',JSON.stringify(GENRES.filter(g=>g.el.getAttribute('aria-pressed')==='true').map(g=>g.label)));
GENRES.forEach(g=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=g.label;
  b.setAttribute('aria-pressed',(Array.isArray(savedSel)?savedSel.includes(g.label):!DEFAULT_OFF.includes(g.label))?'true':'false');
  b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');saveSel()};g.el=b;chipsEl.appendChild(b)});

const cv=$('cv'),ctx=cv.getContext('2d');
const PAL=['#e4572e','#f3a712','#29a98f','#2e86ab','#7b5ea7','#d1495b','#6a994e','#ee7b30'];
let wheelLabels=[],angle=0;
function drawWheel(){
  const n=wheelLabels.length,R=cv.width/2,step=2*Math.PI/n;ctx.clearRect(0,0,cv.width,cv.height);if(!n)return;
  ctx.save();ctx.translate(R,R);ctx.rotate(angle);
  wheelLabels.forEach((t,i)=>{
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-6,i*step,(i+1)*step);ctx.closePath();
    ctx.fillStyle=(i===n-1&&i%8===0&&n>1)?PAL[4]:PAL[i%8];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();
    ctx.save();ctx.rotate(i*step+step/2);ctx.textAlign='left';ctx.textBaseline='middle';
    const fs=n>12?30:n>8?36:44;ctx.font=`900 ${fs}px "Zen Maru Gothic",sans-serif`;ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=5;
    // 先頭の文字は中心のハブのすぐ外から描き、外周に収まらない後ろを「…」にする（先頭が隠れない）
    const x0=R*.07+34,maxW=R-34-x0;let s=t;
    if(ctx.measureText(s).width>maxW){while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);s+='…'}
    ctx.fillText(s,x0,0);ctx.restore();
  });
  ctx.restore();
}
/* タップで回り始め、もう一度タップで減速して止まる。止まった位置のポインタの区画が当たり */
const CANCEL=new Error('cancel');
let ctl=null;
function cancelWheel(){if(ctl){const f=ctl;ctl=null;f()}}
function indexAt(){const n=wheelLabels.length,step=2*Math.PI/n,a=((-Math.PI/2-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(a/step)%n}
function playWheel(){
  cancelWheel();
  return new Promise((res,rej)=>{
    let phase='idle',v=0,raf=0,last=0,tStart=0,t0=0,v0=0,a0=0,T=0;
    const VMAX=11,hint=$('hint');
    hint.textContent='ルーレットをタップして回す';cv.classList.add('tap');hint.classList.add('tap');
    const end=()=>{cancelAnimationFrame(raf);cv.onpointerdown=null;hint.onpointerdown=null;cv.classList.remove('tap');hint.classList.remove('tap')};
    ctl=()=>{end();rej(CANCEL)};
    function frame(now){
      if(phase==='spin'){const dt=Math.min((now-last)/1000,.05);last=now;v=Math.min(VMAX,v+VMAX*dt/.7);angle+=v*dt}
      else if(phase==='stop'){
        const k=Math.min((now-t0)/1000/T,1);angle=a0+v0*T*(1-Math.pow(1-k,3))/3;   // 速さ v0(1-k)^2 で減速
        if(k>=1){drawWheel();end();ctl=null;hint.textContent='';return res(indexAt())}
      }
      drawWheel();raf=requestAnimationFrame(frame);
    }
    const onTap=ev=>{      // ルーレットでも、その下の文字でも、同じように反応する
      ev.preventDefault();const now=performance.now();
      if(phase==='idle'){phase='spin';tStart=last=now;hint.textContent='もう一度タップして止める';raf=requestAnimationFrame(frame)}
      else if(phase==='spin'&&now-tStart>400){phase='stop';hint.textContent='';hint.classList.remove('tap');t0=now;v0=v;a0=angle;T=2.4+Math.random()*1.2}
    };
    cv.onpointerdown=onTap;hint.onpointerdown=onTap;
  });
}
/* クラッカーのように、画面の中心から四方に飛び出す花吹雪（桜の花びらと紙吹雪）。押す操作は邪魔しない */
let cfRun=null;
function confetti(ms){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  let cv2=document.getElementById('confetti');
  if(!cv2){cv2=document.createElement('canvas');cv2.id='confetti';document.body.appendChild(cv2)}
  const dpr=Math.min(window.devicePixelRatio||1,2),W=innerWidth,H=innerHeight;cv2.width=W*dpr;cv2.height=H*dpr;
  const c=cv2.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ffb7c5','#ff8fab','#ffd166','#06d6a0','#4cc9f0','#f72585','#ffffff','#b8f2e6'];
  const cx=W/2,cy=H*.42,reach=Math.max(W,H);
  const mk=(i,delay)=>{const ang=Math.random()*6.2832,sp=reach*(.55+Math.random()*1.05);   // 速さ: 画面の大きさに合わせる
    return {x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-reach*.25,delay,
    w:7+Math.random()*9,h:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*14,ph:Math.random()*6.28,fr:1+Math.random()*2.5,
    petal:i%3===0,col:i%3===0?cols[Math.floor(Math.random()*2)]:cols[Math.floor(Math.random()*cols.length)]}};
  // 2回に分けて打ち上げる（ドン、ドン）
  const ps=[...Array.from({length:110},(_,i)=>mk(i,0)),...Array.from({length:70},(_,i)=>mk(i,.28))];
  const t0=performance.now();let last=t0;
  cancelAnimationFrame(cfRun);
  (function f(now){
    const dt=Math.min((now-last)/1000,.05);last=now;const el=(now-t0)/1000;c.clearRect(0,0,W,H);let alive=0;
    const fade=Math.max(0,Math.min(1,(ms/1000-el)/.8));          // 終わりに近づくと薄くなる
    ps.forEach(q=>{
      if(el<q.delay){alive++;return}
      const drag=Math.pow(.18,dt);                                // 空気抵抗（飛び出しはすぐに減速）
      q.vx*=drag;q.vy*=drag;q.vy+=reach*.55*dt;                   // 重力
      q.x+=q.vx*dt+Math.sin(now/1000*q.fr+q.ph)*30*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;
      if(q.y<H+30&&q.x>-30&&q.x<W+30){alive++;
        c.save();c.globalAlpha=fade;c.translate(q.x,q.y);c.rotate(q.r);c.fillStyle=q.col;
        if(q.petal){c.beginPath();c.ellipse(0,0,q.w*.75,q.h*.5,0,0,6.28);c.fill()}else{c.fillRect(-q.w/2,-q.h/2,q.w,q.h)}
        c.restore()}
    });
    if(el<ms/1000&&alive>0)cfRun=requestAnimationFrame(f);else c.clearRect(0,0,W,H);
  })(t0);
}

function setBusy(b){st.busy=b}
/* 除外する店の種類（Googleの primaryType）。ジャンルを明示的に選んだときは、そのジャンルは除外しない */
const EXC=[{label:'カフェ・スイーツ',types:['cafe','coffee_shop','tea_house','bakery','dessert_restaurant','dessert_shop','ice_cream_shop','confectionery']},
  {label:'バー・カクテル',types:['bar','pub','wine_bar','night_club']}];
function selected(){return GENRES.filter(g=>g.el.getAttribute('aria-pressed')==='true')}
function excluded(){const sel=new Set(selected().map(g=>g.label));if(!sel.size)return [];return EXC.filter(e=>!sel.has(e.label))}
function pool(){const sel=selected();return sel.length?sel:GENRES}   // 何も選ばなければ全ジャンル
async function loadShops(genres,title,my){
  showLoading(true,title,genres&&genres.length===1?`${genres[0].label}のお店を取得中…`:'お店を取得中…');
  try{const r=await fetchShops(genres);if(my!==st.round)throw CANCEL;st.shops=r}finally{if(my===st.round)showLoading(false)}
}
async function runShop(genres,reuse,my){
  if(!reuse){st.shopTitle=genres&&genres.length===1?`お店ルーレット（${genres[0].label}）`:'お店ルーレット';await loadShops(genres,st.shopTitle,my)}
  if(!st.shops.length)return 'empty';
  const rd=st.round;
  setWheel(st.shops.map(s=>s.name),st.shopTitle);
  const s=st.shops[await playWheel()];
  await sleep(700);if(rd!==st.round)throw CANCEL;       // 止まった位置を少し見せる
  showResult(s.name,'お店が決まりました');
  const sh=$('shop');sh.innerHTML='';
  const add=(cls,txt)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;sh.appendChild(d)};
  add('meta',[s.genre,s.price,s.rating].filter(Boolean).join(' ／ '));
  add('meta',[`営業中${s.close?`（${s.close}まで）`:''}`,s.kitchen?`ラストオーダー目安(キッチン) ${s.kitchen}`:'',`現在地から約${Math.round(s._d||0)}m`].filter(Boolean).join(' ／ '));
  st.free=!!s.priceUnknown;     // 価格が不明な店が当たったら、連打なしでもう一回
  $('againShop').textContent=st.free?'価格が不明なのでもう一回（連打なし）':'お店をもう一回';
  const lk=document.createElement('div');lk.className='row';
  [['お店のページを開く',s.site],['Googleマップで開く',s.url]].forEach(([t,u])=>{if(!u)return;const a=document.createElement('a');a.className='lk';a.href=u;a.target='_blank';a.rel='noopener';a.textContent=t;lk.appendChild(a)});
  // 共有: お店のページとGoogleマップの両方を、店名と一緒に送る
  const shareBtn=document.createElement('button');shareBtn.type='button';shareBtn.className='lk';shareBtn.textContent='共有する';
  const shareText=[`${s.name}`,s.site?`お店のページ: ${s.site}`:'',s.url?`Googleマップ: ${s.url}`:''].filter(Boolean).join('\n');
  shareBtn.onclick=async()=>{
    try{if(navigator.share){await navigator.share({title:s.name,text:shareText});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(shareText);shareBtn.textContent='コピーしました';setTimeout(()=>shareBtn.textContent='共有する',2000)}
    catch(e){shareBtn.textContent='共有できませんでした';setTimeout(()=>shareBtn.textContent='共有する',2000)}
  };
  lk.appendChild(shareBtn);
  sh.appendChild(lk);sh.hidden=false;
  try{$('stage').scrollIntoView({block:'start',behavior:'smooth'})}catch(e){}
  return 'ok';
}
/* ジャンルルーレットに出す前の調べ方（検索は最大4回、決まったジャンルの調べ直しで5回目）
   1. 広く30件（3ページ=3回）を取り、種類と名前でジャンルに振り分ける
   2. 店が見つからなかったジャンルを、種類を複数まとめて指定して1回で探す
   3. ここまでで店があったジャンルだけを、ルーレットに出す */
async function loadGenres(my){
  const pl=pool();
  showLoading(true,'ジャンルルーレット','近くのお店を調べています…');
  try{
    const raw=new Map();
    const add=list=>list.forEach(x=>{const g=classify(x);if(!g)return;if(!raw.has(g))raw.set(g,[]);const a=raw.get(g);if(!a.some(y=>y.id===x.id))a.push(x)});
    add(await broadPlaces());
    if(my!==st.round)throw CANCEL;
    const missing=pl.filter(g=>!filterShops(raw.get(g.label)||[]).length);
    const types=[...new Set(missing.flatMap(g=>nearbyTypesOf(g.label)))];
    if(types.length){
      $('loadtxt').textContent='見つからなかったジャンルをまとめて探しています…';
      add(await nearbyPlaces(types));
      if(my!==st.round)throw CANCEL;
    }
        st.rawByGenre=raw;st.byGenre=new Map();
    pl.forEach(g=>{const shops=filterShops(raw.get(g.label)||[]);if(shops.length)st.byGenre.set(g.label,shops)});
  }finally{if(my===st.round)showLoading(false)}
}
/* 「タップしてお店決めへ」を待つ（別の開始ボタンを押されたら破棄） */
function waitNext(){
  cancelWheel();
  return new Promise((res,rej)=>{const b=$('nextBtn');b.onclick=()=>{b.onclick=null;ctl=null;res()};ctl=()=>{b.onclick=null;rej(CANCEL)}});
}
async function runGenre(){
  const my=st.round;
  const pl=pool().filter(g=>st.byGenre&&st.byGenre.has(g.label));
  if(!pl.length){showEmpty();return}
  setWheel(pl.map(g=>g.label),'ジャンルルーレット');
  const g=pl[await playWheel()];st.genre=g;
  await sleep(700);if(my!==st.round)throw CANCEL;       // 止まった位置を少し見せる
  showResult(g.label,'ジャンルが決まりました');
  // 裏でそのジャンルを調べ直す（調べ直せなくても、調べ済みの店で続ける）
  let done=false;
  const rp=(async()=>{
    let fresh=[];try{fresh=(await placesMany([g.q]))[0]||[]}catch(e){fresh=[]}
    const known=(st.rawByGenre&&st.rawByGenre.get(g.label))||[];
    let shops=filterShops(fresh.concat(known));if(!shops.length)shops=st.byGenre.get(g.label)||[];
    done=true;return shops;
  })();
  $('nextBtn').hidden=false;$('genreRe').hidden=false;
  await waitNext();$('nextBtn').hidden=true;$('genreRe').hidden=true;
  if(!done)showLoading(true,'お店ルーレット',`${g.label}のお店を調べ直しています…`);
  const shops=await rp;
  if(my!==st.round)throw CANCEL;
  showLoading(false);
  st.shops=shops;st.shopTitle=`お店ルーレット（${g.label}）`;
  await runShop(null,true,my);
}
async function start(mode){
  const my=++st.round;st.genre=null;      // 押した瞬間に、進行中の処理は破棄して最初からやり直す
  cancelWheel();say('');$('opts').hidden=true;$('optbtn').hidden=true;document.querySelector('.go').hidden=true;document.body.classList.add('round');   // 回し始めたら開始・設定ボタンは隠す（連打なしのやり直しを防ぐ）
  try{
    await resolveSource(my);
    st.mode=mode;
    const sel=selected();
    st.single=sel.length===1;
    if(mode==='genre'&&!st.single){await loadGenres(my);await runGenre()}
    else{
      // 初期の選択（カフェ・バーだけ外れた状態）は、広く1回で探して種類で除く。それ以外に絞ったときは、選んだジャンルごとに探す
      const broad=!sel.length||GENRES.every(g=>sel.includes(g)||EXC.some(e=>e.label===g.label));
      const gs=mode==='genre'?sel:(broad?null:sel);
      const r=await runShop(gs,false,my);if(r==='empty')showEmpty()
    }
    afterRun();
  }catch(e){if(e!==CANCEL){toInitial();say(e.message,true)}}   // 失敗したら初期画面に戻る（開始ボタンが隠れたままにならないように）
}
function afterRun(){
  const hasShop=!$('shop').hidden;
  $('again').hidden=!hasShop;
  $('againGenre').hidden=!hasShop;
}
$('goGenre').onclick=()=>start('genre');
$('goShop').onclick=()=>start('shop');

/* もう一回 → 連打してから。長押しで回すを押すとルーレットが出て、タップするまで回らない */
$('againShop').onclick=async()=>{
  if(st.busy)return;if(!st.free&&!await mash('お店をもう一回するには連打！','もう一回',st.genre?MASH_SHOP_SAME:MASH_SHOP_DIRECT))return;
  try{await runShop(null,true);afterRun()}catch(e){if(e!==CANCEL)say(e.message,true)}
};
/* ジャンルから選び直す: 連打が終わったら初期画面に戻る */
$('againGenre').onclick=async()=>{if(st.busy)return;if(await mash('ジャンルから選び直すには連打！','選び直す',MASH_RESET,true))toInitial()};
/* ジャンルの選び直し（ジャンルが決まった画面から）: 連打のあと、ジャンルルーレットだけをもう一度回す */
$('genreRe').onclick=async()=>{
  if(st.busy)return;if(!await mash('ジャンルを選び直すには連打！','選び直す',MASH_GENRE_RE))return;
  const my=++st.round;cancelWheel();      // 今のジャンル決定画面と、裏の調べ直しは破棄
  try{await runGenre();afterRun()}catch(e){if(e!==CANCEL){toInitial();say(e.message,true)}}
};

/* ---------- 連打画面 ---------- */
function mash(title,label,total,direct){
  return new Promise(resolve=>{
    const ov=$('mash'),btn=$('mbtn'),num=$('mnum'),bar=$('mbar'),wrap=$('mwrap'),done=$('mdone'),hold=$('mhold'),hb=$('mholdbar'),ht=$('mholdtxt');
    const MASH_TOTAL=total;let count=0,over=false,holdT=null,holdStart=0,raf=0;
    $('mtitle').textContent=title;btn.textContent=label;
    num.textContent=MASH_TOTAL;bar.style.width='0';btn.hidden=false;wrap.hidden=false;done.hidden=true;btn.style.width=btn.style.height='';
    ov.hidden=false;document.body.style.overflow='hidden';
    const cleanup=v=>{over=true;cancelAnimationFrame(raf);btn.onpointerdown=null;hold.onpointerdown=null;ov.hidden=true;document.body.style.overflow='';$('mcancel').onclick=null;resolve(v)};
    $('mcancel').onclick=()=>cleanup(false);
    btn.onpointerdown=ev=>{
      ev.preventDefault();if(over||count>=MASH_TOTAL)return;
      count++;const left=MASH_TOTAL-count,p=count/MASH_TOTAL;
      num.textContent=left;bar.style.width=(p*100)+'%';
      const w=Math.min(110+210*p,Math.min(window.innerWidth*.8,340));btn.style.width=btn.style.height=w+'px';
      btn.classList.remove('hit');void btn.offsetWidth;btn.classList.add('hit');
      fx(wrap,btn,w);try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
      if(left===0)finish();
    };
    function finish(){if(direct){confetti(1500);setTimeout(()=>cleanup(true),500);return}confetti(3200);btn.hidden=true;wrap.hidden=true;done.hidden=false;hold.disabled=false;ht.textContent='長押しで回す';hb.style.width='0'}
    // 長押し(約1秒)で初めて先に進む。連打では進まない
    hold.onpointerdown=ev=>{
      ev.preventDefault();if(hold.disabled||over)return;holdStart=performance.now();
      const tick=now=>{const p=Math.min((now-holdStart)/1000,1);hb.style.width=(p*100)+'%';if(p>=1){cleanup(true)}else raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
    };
    const rel=()=>{cancelAnimationFrame(raf);if(!over)hb.style.width='0'};
    hold.onpointerup=rel;hold.onpointerleave=rel;hold.onpointercancel=rel;
  });
}
function fx(wrap,btn,w){
  const r=wrap.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;
  const ring=document.createElement('span');ring.className='fx';ring.style.cssText=`left:${cx-w/2}px;top:${cy-w/2}px;width:${w}px;height:${w}px`;wrap.appendChild(ring);ring.onanimationend=()=>ring.remove();
  for(let i=0;i<4;i++){const s=document.createElement('span');s.className='sp';s.textContent=['✦','＋','★','♪'][i%4];
    const a=Math.random()*Math.PI*2,d=w/2+30+Math.random()*40;s.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;wrap.appendChild(s);s.onanimationend=()=>s.remove()}
}
/* ---------- 地図でピンを刺して場所を決める（Leaflet + OpenStreetMap） ---------- */
let map=null,pinMarker=null,areaCircle=null;
function ensureMap(){
  if(map||typeof L==='undefined')return;
  map=L.map('map',{zoomControl:true}).setView(st.lat!=null?[st.lat,st.lng]:[35.681,139.767],st.lat!=null?15:12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  map.on('click',e=>setPin(e.latlng.lat,e.latlng.lng));
}
function drawPin(lat,lng,fit){
  if(!map)return;
  if(!pinMarker){pinMarker=L.marker([lat,lng],{draggable:true}).addTo(map);pinMarker.on('dragend',()=>{const q=pinMarker.getLatLng();setPin(q.lat,q.lng)})}
  else pinMarker.setLatLng([lat,lng]);
  const r=RADIUS[$('range').value];
  if(!areaCircle)areaCircle=L.circle([lat,lng],{radius:r,color:'#d7322f',weight:2,fillOpacity:.08}).addTo(map);
  else{areaCircle.setLatLng([lat,lng]);areaCircle.setRadius(r)}
  if(fit)map.fitBounds(areaCircle.getBounds(),{padding:[12,12]});     // 探す範囲の円が全部見えるようにする
}
function setPin(lat,lng){
  st.pin={lat,lng};$('place').value='';drawPin(lat,lng);
  $('locst').textContent=`場所: 地図のピン（${lat.toFixed(4)}, ${lng.toFixed(4)}）`;
}
/* 地図の中の検索: 駅名・住所の場所へ地図を動かして、ピンを刺す */
async function mapSearch(){
  const q=$('mapq').value.trim();if(!q)return;
  $('mapmsg').textContent='探しています…';
  try{
    const pl=await geocode(q);
    setPin(pl.lat,pl.lng);drawPin(pl.lat,pl.lng,true);
    $('locst').textContent=`場所: ${pl.name}（地図のピン）`;
    $('mapmsg').textContent=`「${pl.name}」${pl.address||''} にピンを刺しました`;
  }catch(e){$('mapmsg').textContent=e.message}
}
function mapShow(lat,lng,asPin){if(!map||lat==null)return;drawPin(lat,lng,true)}
$('mapbtn').onclick=()=>{
  const b=$('mapbox');b.hidden=!b.hidden;
  if(b.hidden){mapFull(false);return}
  if(typeof L==='undefined'){b.hidden=true;say('地図を読み込めませんでした（通信を確認してください）',true);return}
  ensureMap();
  setTimeout(()=>{map.invalidateSize();if(st.pin)drawPin(st.pin.lat,st.pin.lng,true);else if(st.lat!=null)drawPin(st.lat,st.lng,true)},60);
};
function mapFull(on){
  const f=on===undefined?!$('mapbox').classList.contains('full'):on;
  $('mapbox').classList.toggle('full',f);
  $('mapfs').textContent=f?'✕':'⛶';$('mapfs').setAttribute('aria-label',f?'全画面を閉じる':'地図を全画面にする');
  document.body.style.overflow=f?'hidden':'';
  setTimeout(()=>{if(map)map.invalidateSize()},80);
}
$('mapfs').onclick=()=>mapFull();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('mapbox').classList.contains('full'))mapFull(false)});
$('mapgo').onclick=mapSearch;
$('mapq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();mapSearch()}});
$('range').addEventListener('change',()=>{if(areaCircle){areaCircle.setRadius(RADIUS[$('range').value]);map.fitBounds(areaCircle.getBounds(),{padding:[12,12]})}});
$('place').addEventListener('input',()=>{st.pin=null;if(map&&pinMarker){map.removeLayer(pinMarker);pinMarker=null}if(map&&areaCircle){map.removeLayer(areaCircle);areaCircle=null}});
(function(){            // 落ち込みの縦線（毎回同じ形）
  const ns='http://www.w3.org/2000/svg',svg=$('drip');let h='<path class="w1" d="M0 0H400V64C330 90 270 36 200 62S70 98 0 56Z"/><path class="w2" d="M0 0H400V92C320 116 260 64 190 90S60 124 0 84Z"/>';
  const L=[96,52,128,70,110,44,138,80,60,118,90,48,132,74,104,56,124,86,66,112,94,50,136,78,58,120];
  L.forEach((len,i)=>{const x=8+i*15.3;h+=`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${len}"/>`});
  svg.innerHTML=h;
})();
/* 起動時に合言葉を確認する。中継が合言葉を求めるときだけ聞く（空の検索で確かめるので、検索回数は使わない）。通るまで開始ボタンは押せない */
async function gate(){
  try{await callWorker('/geocode',{query:''})}
  catch(e){if(e.message==='合言葉が必要です'){[$('goGenre'),$('goShop')].forEach(b=>b.disabled=true);say('合言葉が必要です。ページを再読み込みして入力してください',true)}}
}
drawWheel();fetchUsage();gate();
